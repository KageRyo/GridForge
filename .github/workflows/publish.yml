name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: GitHub Release tag to publish
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/gridforge-spatial
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Resolve release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a release tag in vX.Y.Z form; got: $RELEASE_TAG" >&2
            exit 1
          fi
          echo "GRIDFORGE_RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "GRIDFORGE_RELEASE_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"

      - name: Check out workflow validation tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Preserve release validator before checking out historical source
        run: cp scripts/validate_release.py "$RUNNER_TEMP/validate_release.py"

      - name: Check out selected release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.GRIDFORGE_RELEASE_TAG }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv python install 3.12
      - name: Verify selected tag and test locked release source
        run: |
          python -c 'import os, tomllib; project = tomllib.load(open("pyproject.toml", "rb"))["project"]; assert os.environ["GRIDFORGE_RELEASE_VERSION"] == project["version"]'
          uv sync --locked --all-groups --python 3.12
          uv run --locked ruff check .
          uv run --locked ruff format --check .
          uv run --locked pytest -q

      - name: Download existing GitHub Release distributions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "$GRIDFORGE_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern '*.whl' \
            --pattern '*.tar.gz' \
            --dir dist

      - name: Validate release distributions
        run: python "$RUNNER_TEMP/validate_release.py" "$GRIDFORGE_RELEASE_TAG"

      - name: Clean wheel CLI smoke test
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/gridforge-wheel"
          uv pip install --python "$RUNNER_TEMP/gridforge-wheel/bin/python" dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/gridforge-wheel/bin/gridforge" --help
          "$RUNNER_TEMP/gridforge-wheel/bin/gridforge" demo --output-dir "$RUNNER_TEMP/gridforge-demo"

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
